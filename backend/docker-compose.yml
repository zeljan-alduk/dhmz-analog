services:
  dhmz-backend:
    build: .
    container_name: dhmz-backend
    restart: unless-stopped
    # Bind-mount app/ for fast iteration: edit code on host, restart
    # container (no rebuild needed) to pick up changes.
    volumes:
      - ./app:/app/app:ro
      # Bundled chart-type reference templates (empty / prazna scans). Used
      # by /api/extract-trace as the default template when the request
      # doesn't include one.
      - ./templates:/app/templates:ro
      # ONNX trace-segmenter model — loaded at module import. If the file is
      # missing the backend falls back to the legacy HSV trace mask, so this
      # mount is optional in principle but expected in production.
      - ./models:/app/models:ro
      # Persistent session store: state.json + image_<rev>.<fmt> +
      # attach/<aid>.<ext> per session. Survives `docker compose restart`
      # and redeploys. TTL cleanup task rmtrees expired sessions.
      - ./data:/data
    # workers=1 — session state lives in process memory; multiple workers
    # don't share STORE so requests round-robin'd to a different worker
    # would 404. Sessions also persist to /data so a restart re-hydrates
    # the same set.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    networks:
      - edge

networks:
  edge:
    name: slovenia-transit_default
    external: true
